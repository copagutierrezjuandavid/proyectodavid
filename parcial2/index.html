<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salteñeria El Horno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Salteñería El Horno</h1>
  </header>

  <main>
    <section class="tarjeta">
      <p>
        Bienvenido a la Salteñería El Horno donde preparamos cada día salteñas
        jugosas y recién horneadas haz tu pedido aqui y te lo tendremos listo
      </p>


      <form id="form-horno" method="POST" action="procesar.php" novalidate>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido">

        <label for="correo">Correo electronico</label>
        <input type="text" id="correo" name="correo" placeholder="tunombre@gmail.com">

        <label for="pedido">¿Que salteñas quers?</label>
        <input type="text" id="pedido" name="pedido" placeholder="Ej: 3 de pollo y 1 refresco">

        <button type="submit">Hacer mi pedido</button>

        <p id="aviso-horno" class="aviso"></p>
      </form>
    </section>
  </main>
  <footer>
    <p>Juan David Copa Gutierrez  - FECHA 20 de Octubre </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
